  if(!token){setStatus('❌ הכנס טוקן','err');return;}
  localStorage.setItem('gh_deploy_token',token);
  goBtn.disabled=true;
  goBtn.textContent='⏳ מעדכן...';
  setStatus('📤 מעדכן index.html ב-reset-router...');
  
  try{
    const apiUrl='https://api.github.com/repos/pinto1212121212-create/reset-router/contents/index.html';
    const r1=await fetch(apiUrl,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    let sha=null;
    if(r1.ok)sha=(await r1.json()).sha;
    else if(r1.status===401)throw new Error('טוקן לא תקף');
    else if(r1.status!==404){const e=await r1.json().catch(()=>({}));throw new Error('GET '+r1.status+': '+(e.message||'err'));}
    
    const body={message:'Fix: use therapy-hodaya instead of diary-hodaya',content:B64};
    if(sha)body.sha=sha;
    const r2=await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r2.ok){const e=await r2.json().catch(()=>({}));throw new Error('PUT '+r2.status+': '+(e.message||'err'));}
